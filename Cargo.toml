[workspace]
resolver = "2"
members = [
    "crates/volucer-core",
    "crates/volucer-worker",
    "crates/volucer-fcgi",
    "crates/volucer-server",
    "crates/volucer-http",
    "crates/volucer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sailantis/volucer"

[workspace.dependencies]
volucer-core = { path = "crates/volucer-core" }
volucer-worker = { path = "crates/volucer-worker" }
volucer-fcgi = { path = "crates/volucer-fcgi" }
volucer-server = { path = "crates/volucer-server" }
volucer-http = { path = "crates/volucer-http" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
httpdate = "1"
rustls = "0.23"
rustls-pemfile = "2"
tokio = { version = "1", features = ["net", "fs", "io-util", "rt-multi-thread", "time"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
