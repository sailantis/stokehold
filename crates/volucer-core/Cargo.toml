[package]
name = "volucer-core"
description = "Configuration, backend model and PHP discovery for volucer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[features]
default = []
# Enables the `redis` KV driver *in the configuration model*: a build without it refuses
# `driver = "redis"` at parse time, which is the honest answer, rather than accepting a table whose store
# cannot be built. The feature carries no dependency of its own — the driver itself lives in
# `volucer-kv` — so this only widens the enum.
redis = []
