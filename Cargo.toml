[workspace]
resolver = "2"
members = [
    "crates/volucer-core",
    "crates/volucer-worker",
    "crates/volucer-fcgi",
    "crates/volucer-server",
    "crates/volucer-http",
    "crates/volucer-watch",
    "crates/volucer-observe",
    "crates/volucer-metrics",
    "crates/volucer-kv",
    "crates/volucer-lock",
    "crates/volucer-acme",
    "crates/volucer-upstream",
    "crates/volucer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Not 1.85, which is what this said until CI checked it. `cargo check` on 1.85 refuses the
# workspace: `time` 0.3.55 and `time-core` 0.1.9 declare `rust-version = 1.88.0`, and they reach
# us through `x509-parser` -> `asn1-rs` -> `time` (and `rcgen`). Measured, not read off the
# manifests: 1.85.1 fails, 1.88.0 passes. The `msrv` job in `.github/workflows/ci.yml` is what
# keeps this number honest.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sailantis/volucer"

# Crate names are flat on crates.io, even though an organization owns them, so the
# `volucer-` prefix is what keeps the family together: `volucer-core`, `volucer-http`, ...
# The exception is the CLI, which is named `volucer` itself so that `cargo install volucer`
# works. Keep every entry here on the same version as `[workspace.package] version`:
# a published crate cannot depend on a version that does not exist, so these move together.
[workspace.dependencies]
volucer-core = { version = "0.1.0", path = "crates/volucer-core" }
arc-swap = "1"
volucer-worker = { version = "0.1.0", path = "crates/volucer-worker" }
volucer-fcgi = { version = "0.1.0", path = "crates/volucer-fcgi" }
volucer-server = { version = "0.1.0", path = "crates/volucer-server" }
volucer-http = { version = "0.1.0", path = "crates/volucer-http" }
volucer-watch = { version = "0.1.0", path = "crates/volucer-watch" }
volucer-observe = { version = "0.1.0", path = "crates/volucer-observe" }
volucer-metrics = { version = "0.1.0", path = "crates/volucer-metrics" }
volucer-kv = { version = "0.1.0", path = "crates/volucer-kv" }
volucer-lock = { version = "0.1.0", path = "crates/volucer-lock" }
# The Redis client, **optional** and behind a feature. A deployment using the in-memory store must not
# link a Redis to get it, which is the rule `docs/plugins.md` §5 states for every driver. Default
# features are off — they pull in `num-bigint` for big-number support a KV store does not use — and
# `connection-manager` is deliberately **not** enabled: it implies `aio` and therefore a runtime, and
# these stores are synchronous on purpose. `sha1_smol` arrives with `redis`'s `script` feature, which
# only `volucer-lock` asks for: the lock operations are Lua and `Script` is the API for them.
redis = { version = "1.7", default-features = false }
volucer-acme = { version = "0.1.0", path = "crates/volucer-acme" }
volucer-upstream = { version = "0.1.0", path = "crates/volucer-upstream" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "tokio",
    # The upstream backend's client, alongside the listener's server. `client-legacy` is what
    # builds a pooled HTTP/1.1 and HTTP/2 client, and it is the only user of `socket2`,
    # `httparse` and `libc` in that crate. `client-pool` is deliberately absent: it gates
    # `client::conn::pool`, which nobody uses here — the pooling comes from `client-legacy`.
    "client",
    "client-legacy",
    "http1",
    "http2",
] }
# The upstream backend's connector has to be written by hand (see `volucer-upstream`), and a
# hand-written connector is a `tower_service::Service`, so the trait has to be nameable here.
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"
httpdate = "1"
# The request id and the W3C trace context. `getrandom` is named at 0.4 because that is the
# version already in the lockfile (twice: 0.2.17 via `ring`, 0.4.3 via `jobserver`), so taking
# the one that is there adds no crate to the graph at all — and taking 0.4 rather than 0.2 is
# what keeps that true.
getrandom = { version = "0.4", default-features = false }
rustls = "0.23"
# The public roots an `https:` upstream origin is verified against when no CA is named. Pinned
# to 1.x so it is the *same* package `rustls-acme` already pulls in (0.26 is a separate entry
# in the lockfile that only `futures-rustls` uses), which means adding this changes the
# dependency graph not at all.
webpki-roots = "1"
# Reading a certificate's expiry, for `volucer check`. Already in the graph as a dependency of
# `rustls-acme`, and taken with `default-features = false` — the same features rustls-acme uses —
# so this adds not one crate to the build. The alternative was a hand-rolled ASN.1 walk, which is
# not the kind of parsing to write by hand.
x509-parser = { version = "0.18", default-features = false }
rustls-pemfile = "2"

# The ACME client: the order/renewal flow, and the TLS-ALPN-01 challenge certificate.
#
# The feature set is *not* `--no-default-features`: the crate is a compile-time fork of our crypto
# provider, so `aws-lc-rs` must be named explicitly — but `webpki-roots` is where
# `AcmeConfig::new` gets the trust anchors it verifies **Let's Encrypt's own** HTTPS endpoint
# with. Dropping it (as an earlier draft of the plan prescribed) removes the function
# `AcmeConfig::new` entirely, so the client cannot reach the directory at all. `tls12` is left out:
# ACME endpoints are TLS 1.3-capable.
#
# `tokio` is left **off deliberately**. It enables `AcmeConfig::tokio_incoming`, a ready-made accept
# loop — and that is exactly the shape this project must not use: `rustls-acme`'s resolver answers
# *every* SNI name with one certificate, so it would silently replace our host→certificate rule. The
# composition has to be ours (challenge ALPN → ACME, else → the site table), so the wrapper is a
# footgun rather than a convenience, and leaving it unlinked is the cheapest way to say so.
rustls-acme = { version = "0.15", default-features = false, features = ["aws-lc-rs", "webpki-roots"] }

tokio = { version = "1", features = ["net", "fs", "io-util", "rt-multi-thread", "time"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
