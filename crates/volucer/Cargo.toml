[package]
# Named `volucer`, not `volucer-cli`, so that `cargo install volucer` installs the server.
name = "volucer"
description = "A cross-platform PHP application server: persistent workers and FastCGI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `cargo install volucer` and a crates.io page both read these; without them the page is a bare
# title. The path points at the workspace README rather than a second copy that would drift.
readme = "../../README.md"
keywords = ["php", "fastcgi", "server", "worker", "application-server"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "volucer"
path = "src/main.rs"

[dependencies]
volucer-core.workspace = true
volucer-fcgi.workspace = true
volucer-http.workspace = true
# The access log, for `serve` to build and `check` to report the destination of.
volucer-observe.workspace = true
# The registry behind the metrics endpoint. A leaf crate, and the only new dependency this step
# adds; see its manifest for why the exposition encoder is written by hand.
volucer-metrics.workspace = true
volucer-server.workspace = true
# The ACME engine, so a configured `[server.acme]` actually issues rather than merely validating.
volucer-acme.workspace = true
clap.workspace = true
futures.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true

[features]
default = []
# Carries the KV drivers that need a client library up through the tree, so
# `cargo install volucer --features redis` produces a server that can serve a `[kv.*]` table naming
# Redis — and without it, `volucer check` refuses that table by name instead of starting a server whose
# every `kv.*` call would fail. See `docs/plugins.md` §5.
redis = ["volucer-server/redis", "volucer-core/redis"]

# Signals are split by platform because the *mechanism* is, not the behaviour.
#
# On Unix, `signal-hook` is used rather than `ctrlc` even though `ctrlc` is already here for
# Windows. `ctrlc`'s one handler is invoked for every signal it registered, and its public API
# cannot say *which* one arrived — so a handler that had to tell a reload from a shutdown had no
# way to do it. Worse, its `termination` feature registers `SIGHUP` and runs the shutdown
# callback for it, so `kill -HUP` — the conventional reload on every Unix server — stopped the
# server instead. `signal-hook`'s iterator yields the signal number, which is what makes
# "SIGHUP reloads, SIGTERM stops" expressible at all.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

# Windows has no `SIGHUP`. `ctrlc` covers `CTRL_C_EVENT`, `CTRL_BREAK_EVENT` and the
# `CTRL_CLOSE_EVENT` a console window sends on close, and its default feature set is enough:
# the `termination` feature is what adds `SIGHUP`, which does not exist here.
[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[dev-dependencies]
# Certificates are generated per test run rather than committed: a committed key is a key that
# ends up in someone's deployment.
rcgen = "0.13"

# For `an_acme_configured_server_serves_its_cached_certificate`: writing a cached certificate
# through the crate's own `CertCache` trait, so the file name (a hash of the names and the
# directory URL) is the one the engine will look for. A test that wrote the file by hand would pass
# against a name nothing reads. Already in the graph via `volucer-acme`.
rustls-acme = { version = "0.15", default-features = false, features = ["aws-lc-rs", "webpki-roots"] }

# A TLS *client*, so `one_sighup_reloads_a_certificate_and_a_site_together` can assert which
# certificate a handshake was presented with. The server's own `rustls` is a dependency of
# `volucer-http` and cannot be used to read what it presented — the client half of the
# handshake is the observation.
[target.'cfg(unix)'.dev-dependencies]
rustls = { version = "0.23", features = ["custom-provider"] }
