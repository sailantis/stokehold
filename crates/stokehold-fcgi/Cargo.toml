[package]
name = "stokehold-fcgi"
description = "FastCGI record codec and client for stokehold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stokehold-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

# `TCP_QUICKACK` has no wrapper in std, and it is a Linux-only option: it is the
# receiver-side half of the Nagle/delayed-ACK interaction documented on
# `Stream::arm_immediate_ack`. Nothing else here needs libc.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
